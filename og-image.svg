<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gtext" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1117"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect width="1200" height="4" fill="url(#topbar)"/>

  <!-- Logo mark -->
  <rect x="80" y="200" width="100" height="100" rx="14" fill="#1a1d27"/>
  <polyline points="101,228 128,250 101,272" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="138" y1="278" x2="160" y2="222" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>

  <!-- jc/apps wordmark -->
  <text x="204" y="272" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="72" font-weight="700" letter-spacing="-2">
    <tspan fill="url(#gtext)">jc</tspan><tspan fill="rgba(255,255,255,0.3)" font-weight="300">/</tspan><tspan fill="white" font-weight="400">apps</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="26" fill="rgba(255,255,255,0.45)" font-weight="400">
    Self-hosted tools for small teams. No database, no Docker, free forever.
  </text>

  <!-- Bottom pills -->
  <rect x="80" y="430" width="160" height="36" rx="4" fill="rgba(15,118,110,0.15)" stroke="rgba(15,118,110,0.4)" stroke-width="1"/>
  <text x="160" y="453" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="600">PHP 8</text>

  <rect x="256" y="430" width="200" height="36" rx="4" fill="rgba(15,118,110,0.15)" stroke="rgba(15,118,110,0.4)" stroke-width="1"/>
  <text x="356" y="453" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="600">Flat-file JSON</text>

  <rect x="472" y="430" width="180" height="36" rx="4" fill="rgba(15,118,110,0.15)" stroke="rgba(15,118,110,0.4)" stroke-width="1"/>
  <text x="562" y="453" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="600">Vanilla JS</text>

  <rect x="668" y="430" width="200" height="36" rx="4" fill="rgba(15,118,110,0.15)" stroke="rgba(15,118,110,0.4)" stroke-width="1"/>
  <text x="768" y="453" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="600">Open Source</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="'IBM Plex Mono', monospace" font-size="18" fill="rgba(255,255,255,0.2)" text-anchor="end">jcapps.dev</text>
</svg>
