name: Update Transfer version

on:
  repository_dispatch:
    types: [transfer_release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch version in index.html
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          [[ "$VERSION" != v* ]] && VERSION="v$VERSION"
          sed -i "s|id=\"transfer-version\">v[0-9.]*<|id=\"transfer-version\">$VERSION<|" index.html
          echo "Updated to $VERSION"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update Transfer version to ${{ github.event.client_payload.version }}"
          git push
