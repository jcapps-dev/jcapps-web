<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Preview</title>
    <style>
        body {
            background: #f5f3ee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, sans-serif;
            gap: 0;
        }
        .variants {
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }
        .variant {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .variant svg {
            width: 200px;
            height: 200px;
            border-radius: 32px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18);
        }
        .label {
            font-size: 13px;
            color: #68635a;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        /* also show at favicon size */
        .variant-small svg {
            width: 32px;
            height: 32px;
            border-radius: 5px;
        }
        .sizes {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .variant-medium svg {
            width: 64px;
            height: 64px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="variants">

    <!-- VARIANT 1: Slash only -->
    <div class="variant">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <defs>
                <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0f766e"/>
                    <stop offset="100%" stop-color="#0891b2"/>
                </linearGradient>
            </defs>
            <rect width="32" height="32" fill="#0f1117"/>
            <line x1="10.5" y1="26" x2="21.5" y2="6" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div class="sizes">
            <div class="variant-small">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g1s" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <line x1="10.5" y1="26" x2="21.5" y2="6" stroke="url(#g1s)" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="variant-medium">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g1m" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <line x1="10.5" y1="26" x2="21.5" y2="6" stroke="url(#g1m)" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="label">1 — Slash only</div>
    </div>

    <!-- VARIANT 2: >_ prompt -->
    <div class="variant">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <defs>
                <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0f766e"/>
                    <stop offset="100%" stop-color="#0891b2"/>
                </linearGradient>
            </defs>
            <rect width="32" height="32" fill="#0f1117"/>
            <!-- > chevron in white -->
            <polyline points="7,10 14,16 7,22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- / slash in gradient -->
            <line x1="18" y1="24" x2="25" y2="8" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="sizes">
            <div class="variant-small">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g2s" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <polyline points="7,10 14,16 7,22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="18" y1="24" x2="25" y2="8" stroke="url(#g2s)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="variant-medium">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g2m" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <polyline points="7,10 14,16 7,22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="18" y1="24" x2="25" y2="8" stroke="url(#g2m)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="label">2 — &gt;/ prompt</div>
    </div>

    <!-- VARIANT 3: jc/ with geometric slash -->
    <div class="variant">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <defs>
                <linearGradient id="g3" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0f766e"/>
                    <stop offset="100%" stop-color="#0891b2"/>
                </linearGradient>
            </defs>
            <rect width="32" height="32" fill="#0f1117"/>
            <text x="3" y="22"
                  font-family="'Courier New', Courier, monospace"
                  font-size="14"
                  font-weight="700"
                  fill="#ffffff"
                  letter-spacing="1">jc</text>
            <line x1="22" y1="25" x2="29" y2="7" stroke="url(#g3)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div class="sizes">
            <div class="variant-small">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g3s" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <text x="3" y="22" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">jc</text>
                    <line x1="22" y1="25" x2="29" y2="7" stroke="url(#g3s)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="variant-medium">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
                    <defs><linearGradient id="g3m" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0891b2"/></linearGradient></defs>
                    <rect width="32" height="32" fill="#0f1117"/>
                    <text x="3" y="22" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">jc</text>
                    <line x1="22" y1="25" x2="29" y2="7" stroke="url(#g3m)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="label">3 — jc + slash (Courier New)</div>
    </div>

</div>
</body>
</html>
